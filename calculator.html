<script>
function fee(a){
  if (a <= 1000) {
    if(a<=10)return 1.25;
    if(a<=40)return 3.15;
    if(a<=70)return 5;
    if(a<=100)return 7.5;
    if(a<=200)return 12.5;
    if(a<=300)return 18.75;
    if(a<=500)return 27.5;
    if(a<=750)return 43.75;
    return 62.5;
  }
  return a * 0.0625;
}

/* icons */
const icons = {
  "Cash App": "💵",
  "PayPal (F&F)": "🅿️",
  "Apple Pay": "🍎",
  "Venmo": "💙",
  "Zelle": "🏦",
  "Crypto": "🔗"
};

function calculate() {
  const mode = document.getElementById("mode").value;
  const svc = document.getElementById("service").value;
  const qty = parseFloat(document.getElementById("qty").value) || 0;

  const exchangeFields = document.getElementById("exchangeFields");
  const serviceField = document.getElementById("service").parentElement;
  const result = document.getElementById("result");

  const from = document.getElementById("from").value;
  const to = document.getElementById("to").value;

  // toggle UI
  exchangeFields.style.display = mode === "exchange" ? "block" : "none";
  serviceField.style.display = mode === "exchange" ? "none" : "block";

  // ===== SERVICES =====
  if(mode === "service"){
    if (!svc || qty <= 0) {
      result.classList.remove("visible");
      return;
    }

    const [price, per] = svc.split(",").map(Number);
    let total = (qty / per) * price;

    if (total < 1) total = 1;

    document.getElementById("res-rate").textContent =
      `$${price} / ${per.toLocaleString()}`;

    document.getElementById("res-qty").textContent =
      qty.toLocaleString();

    document.getElementById("res-total").textContent =
      `$${total.toFixed(2)}`;

    result.classList.add("visible");
  }

  // ===== EXCHANGE =====
  if(mode === "exchange"){
    if (qty <= 0) {
      result.classList.remove("visible");
      return;
    }

    const f = fee(qty);
    const receive = qty - f;

    document.getElementById("res-rate").textContent =
      `Fee: $${f.toFixed(2)}`;

    document.getElementById("res-qty").textContent =
      `${icons[from]} You send $${qty.toFixed(2)}`;

    document.getElementById("res-total").textContent =
      `${icons[to]} $${receive.toFixed(2)} received`;

    result.classList.add("visible");
  }
}

/* FORCE LIVE */
["service","qty","mode","from","to"].forEach(id=>{
  const el = document.getElementById(id);
  el.addEventListener("input", calculate);
  el.addEventListener("change", calculate);
});
</script>
